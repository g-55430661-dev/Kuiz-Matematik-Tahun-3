    // Fungsi pengacakan array (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Bunyi maklum balas ringkas
    function playAudio(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        // Abaikan jika tidak disokong pelayar
      }
    }

        const currentQ = questions[currentIndex];
        const isCorrect = selectedOption === currentQ.answer;

        if (isCorrect) {

          if (!userAnswers[currentQ.id]) {

          setShowHint(true);

            attempts: (prev[currentQ.id]?.attempts || 0) + 1

          setIsSubmitted(false);

          const percentage = Math.round((finalScore / questions.length) * 100);

            id: Date.now(),
            name: studentName,
            class: studentClass,
            score: finalScore,
            total: questions.length,
            percentage: percentage,
            date: new Date().toLocaleDateString('ms-MY', {

        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Rekod_Keputusan_Matematik_Tahun3_${new Date().toISOString().slice(0,10)}.csv`);

          summary[q.topic].total += 1;
          if (userAnswers[q.id]?.isCorrect) {
            summary[q.topic].correct += 1;
          }

          topic,
          correct: summary[topic].correct,
          total: summary[topic].total,
          percentage: Math.round((summary[topic].correct / summary[topic].total) * 100)

              </div>
            )}

            {/* 5. LOG MASUK GURU */}
            {mode === 'TEACHER_LOGIN' && (
              <div className="max-w-md mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-yellow-100 mt-6">
                <div className="text-center mb-6">
                  <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
                    <i className="fa-solid fa-lock"></i>
                  </div>
                  <h2 className="text-2xl font-bold text-gray-800">Mod Guru</h2>
                  <p className="text-xs text-gray-500 mt-1">Masukkan kata laluan guru untuk mengakses papan pemuka.</p>
                </div>

                <form onSubmit={handleTeacherLogin} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">
                      Kata Laluan:
                    </label>
                    <input
                      type="password"
                      required
                      placeholder="••••"
                      value={teacherPassword}
                      onChange={(e) => setTeacherPassword(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200 outline-none text-center text-2xl tracking-widest text-gray-800 font-bold transition"
                    />
                    {passwordError && (
                      <p className="text-red-500 text-xs font-bold mt-1 text-center">{passwordError}</p>
                    )}
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setMode('HOME')}
                      className="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="w-2/3 bg-yellow-500 hover:bg-yellow-600 text-blue-900 font-bold py-3 rounded-xl shadow-lg transition"
                    >
                      Log Masuk
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* 6. PAPAN PEMUKA GURU (TEACHER DASHBOARD) */}
            {mode === 'TEACHER_DASHBOARD' && (
              <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-blue-100 my-4 space-y-6">
                
                {/* Header Guru */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-blue-900 flex items-center gap-2">
                      <i className="fa-solid fa-chart-line text-yellow-500"></i> Papan Pemuka Rekod Keputusan Murid
                    </h2>
                    <p className="text-xs text-gray-500 mt-1">
                      Jumlah Rekod Disimpan (Lokal): <b>{records.length}</b> penyertaan
                    </p>
                  </div>

                  {/* Butang Kawalan Guru */}
                  <div className="flex flex-wrap gap-2 no-print">
                    <button
                      onClick={handleDownloadExcel}
                      className="bg-green-600 hover:bg-green-700 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-file-excel text-base"></i> Download Excel
                    </button>
                    <button
                      onClick={handlePrint}
                      className="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-print text-base"></i> Print Report
                    </button>
                    <button
                      onClick={clearAllRecords}
                      className="bg-red-600 hover:bg-red-700 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-trash-can text-base"></i> Padam Rekod
                    </button>
                  </div>
                </div>

                {/* Tetapan Pangkalan Data Google Drive */}
                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 p-4 rounded-2xl no-print">
                  <h3 className="font-bold text-blue-900 text-sm flex items-center gap-2 mb-2">
                    <i className="fa-solid fa-database text-indigo-600"></i> Tetapan Integration Google Drive (Google Sheets Database)
                  </h3>
                  <form onSubmit={handleSaveGoogleUrl} className="flex flex-col md:flex-row gap-2">
                    <input
                      type="url"
                      placeholder="Tampal Google Apps Script Web App URL di sini..."
                      value={googleScriptUrl}
                      onChange={(e) => setGoogleScriptUrl(e.target.value)}
                      className="flex-grow px-3 py-2 text-xs md:text-sm rounded-xl border border-gray-300 outline-none focus:border-indigo-500"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs md:text-sm px-4 py-2 rounded-xl transition shadow"
                    >
                      Simpan URL
                    </button>
                  </form>
                  {saveUrlSuccess && (
                    <p className="text-xs font-bold text-green-600 mt-1">
                      <i className="fa-solid fa-check-circle"></i> URL Google Script berjaya disimpan!
                    </p>
                  )}
                  <p className="text-[11px] text-gray-500 mt-1">
                    *Tampalkan Web App URL daripada Google Apps Script untuk menyimpan semua keputusan jawapan murid terus ke Google Sheet secara automatik.
                  </p>
                </div>

                {/* Tajuk Laporan Cetakan */}
                <div className="print-only text-center my-6">
                  <h1 className="text-2xl font-bold">LAPORAN KEPUTUSAN KUIZ MATEMATIK TAHUN 3</h1>
                  <p className="text-sm">Dicetak pada: {new Date().toLocaleDateString('ms-MY')}</p>
                </div>

                {/* Jadual Keputusan */}
                {records.length > 0 ? (
                  <div className="overflow-x-auto border rounded-2xl">
                    <table className="w-full text-left text-sm text-gray-700">
                      <thead className="bg-indigo-50 text-indigo-900 uppercase text-xs font-extrabold border-b">
                        <tr>
                          <th className="p-3">#</th>
                          <th className="p-3">Nama Murid</th>
                          <th className="p-3">Kelas</th>
                          <th className="p-3">Tarikh & Masa</th>
                          <th className="p-3 text-center">Markah</th>
                          <th className="p-3 text-center">Peratus (%)</th>
                          <th className="p-3 text-center">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {records.map((r, idx) => (
                          <tr key={r.id} className="hover:bg-gray-50 transition">
                            <td className="p-3 font-bold text-gray-400">{idx + 1}</td>
                            <td className="p-3 font-bold text-gray-800">{r.name}</td>
                            <td className="p-3"><span className="bg-gray-100 px-2 py-1 rounded text-xs font-semibold">{r.class}</span></td>
                            <td className="p-3 text-xs text-gray-500">{r.date}</td>
                            <td className="p-3 text-center font-bold">{r.score} / {r.total}</td>
                            <td className="p-3 text-center font-extrabold text-indigo-600">{r.percentage}%</td>
                            <td className="p-3 text-center">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                r.percentage >= 80 
                                  ? 'bg-green-100 text-green-800' 
                                  : r.percentage >= 50 
                                  ? 'bg-yellow-100 text-yellow-800' 
                                  : 'bg-red-100 text-red-800'
                              }`}>
                                {r.percentage >= 80 ? 'Cemerlang' : r.percentage >= 50 ? 'Memuaskan' : 'Perlu Bimbingan'}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div className="text-center py-12 text-gray-400">
                    <i className="fa-solid fa-inbox text-5xl mb-3 block"></i>
                    <p className="font-semibold">Belum ada sebarang rekod jawapan murid disimpan.</p>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 no-print">
            <p>© 2026 Kuiz Interaktif Matematik Tahun 3 • Dibina untuk Kecemerlangan Murid</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
