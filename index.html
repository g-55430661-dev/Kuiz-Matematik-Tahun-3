    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxuCh2iL4hEDfyV1zm8xKQB2b1I4W3Zgm-1EDHO01pi1yNDoxHx0I_UTEzO56FV-LkRw/exec";

        const KELAS_LIST = [
            "3 Dedikasi", "3 Efektif", "3 Intelek", "3 Inovatif",
            "3 Kreatif", "3 Optimis", "3 Positif", "3 Proaktif", "3 Progresif"
        ];

        const SOALAN_DATABASE = [
            { id: 1, topic: "NILAI TEMPAT", type: "mcq", question: "Apakah nilai tempat bagi digit 7 dalam nombor 5 782?", options: ["Sa", "Puluh", "Ratus", "Ribu"], answer: "Ratus", hint: "Perhatikan kedudukan digit 7 dari kanan: Sa, Puluh, Ratus, Ribu.", explanation: "Dalam 5 782: 2 ialah sa, 8 ialah puluh, 7 ialah ratus, dan 5 ialah ribu." },
            { id: 2, topic: "NILAI TEMPAT", type: "short", question: "Tuliskan nilai digit bagi 4 dalam nombor 4 309.", options: ["4", "40", "400", "4000"], answer: "4000", hint: "Digit 4 berada di nilai tempat ribu.", explanation: "Nilai digit bagi 4 di tempat ribu ialah 4 000." },
            { id: 3, topic: "BUNDAR NOMBOR", type: "mcq", question: "Bundarkan 3 458 kepada puluh terdekat.", options: ["3 450", "3 460", "3 500", "3 400"], answer: "3 460", hint: "Lihat digit sa (8). Jika 5 atau lebih, tambah 1 pada nilai puluh.", explanation: "Digit sa ialah 8 (>=5), jadi puluh 5 bertambah menjadi 6 ➔ 3 460." },
            { id: 4, topic: "BUNDAR NOMBOR", type: "tf", question: "4 892 dibundarkan kepada ratus terdekat menjadi 4 900.", options: ["Betul", "Salah"], answer: "Betul", hint: "Lihat digit puluh (9).", explanation: "Digit puluh ialah 9 (>=5), jadi ratus 8 bertambah menjadi 9 ➔ 4 900." },
            { id: 5, topic: "OPERASI TAMBAH", type: "mcq", question: "2 415 + 1 382 = ?", options: ["3 797", "3 798", "3 897", "3 697"], answer: "3 797", hint: "Tambah mengikut nilai tempat dari sa ke ribu.", explanation: "2 415 + 1 382 = 3 797." },
            { id: 6, topic: "OPERASI TAMBAH", type: "scenario", question: "Ahmad ada 1 250 biji guli. Ali memberi 840 biji guli lagi kepadanya. Berapakah jumlah guli Ahmad?", options: ["2 090", "2 080", "2 190", "1 990"], answer: "2 090", hint: "Operasi tambah: 1 250 + 840.", explanation: "1 250 + 840 = 2 090 biji guli." },
            { id: 7, topic: "OPERASI TOLAK", type: "mcq", question: "5 680 - 2 340 = ?", options: ["3 340", "3 240", "3 440", "3 140"], answer: "3 340", hint: "Tolak sa, puluh, ratus, dan ribu.", explanation: "5 680 - 2 340 = 3 340." },
            { id: 8, topic: "OPERASI TOLAK", type: "tf", question: "8 000 - 3 500 = 4 500.", options: ["Betul", "Salah"], answer: "Betul", hint: "80 ratus - 35 ratus = 45 ratus.", explanation: "8 000 - 3 500 = 4 500." },
            { id: 9, topic: "OPERASI DARAB", type: "mcq", question: "124 × 6 = ?", options: ["744", "724", "644", "754"], answer: "744", hint: "4×6=24, 2×6=12, 1×6=6.", explanation: "124 × 6 = 744." },
            { id: 10, topic: "OPERASI DARAB", type: "short", question: "Sebuah kotak ada 100 biji pensel. Berapakah pensel dalam 8 buah kotak yang sama?", options: ["800", "80", "8000", "880"], answer: "800", hint: "8 × 100.", explanation: "8 × 100 = 800 biji pensel." },
            { id: 11, topic: "OPERASI BAHAGI", type: "mcq", question: "48 ÷ 6 = ?", options: ["7", "8", "9", "6"], answer: "8", hint: "Ingat sifir 6: 6 × ? = 48.", explanation: "6 × 8 = 48, jadi 48 ÷ 6 = 8." },
            { id: 12, topic: "OPERASI BAHAGI", type: "scenario", question: "Cikgu Siti mengagihkan 150 biji gula-gula secara sama rata kepada 5 buah kumpulan. Berapa biji gula-gula setiap kumpulan dapat?", options: ["25", "30", "35", "40"], answer: "30", hint: "150 ÷ 5.", explanation: "150 ÷ 5 = 30 biji gula-gula." },
            { id: 13, topic: "TAMBAH PECAHAN", type: "mcq", question: "2/7 + 3/7 = ?", options: ["5/7", "5/14", "1/7", "6/7"], answer: "5/7", hint: "Jika penyebut sama, tambah pengangka sahaja.", explanation: "2 + 3 = 5, jadi jawapannya 5/7." },
            { id: 14, topic: "TAMBAH PECAHAN", type: "tf", question: "1/5 + 2/5 = 3/10.", options: ["Betul", "Salah"], answer: "Salah", hint: "Penyebut kekal sama!", explanation: "Penyebut kekal 5, jadi 1/5 + 2/5 = 3/5, bukan 3/10." },
            { id: 15, topic: "KENAL PECAHAN PERSERATUS DAN PERPULUHAN", type: "mcq", question: "Apakah bentuk perpuluhan bagi pecahan 45/100?", options: ["0.45", "4.5", "0.045", "45.0"], answer: "0.45", hint: "Dua tempat perpuluhan untuk perseratus.", explanation: "45/100 = 0.45." },
            { id: 16, topic: "KENAL PECAHAN PERSERATUS DAN PERPULUHAN", type: "short", question: "Tulis 0.08 dalam bentuk pecahan perseratus.", options: ["8/100", "80/100", "8/10", "1/8"], answer: "8/100", hint: "0.08 mempunyai 2 digit di belakang titik.", explanation: "0.08 = 8/100." },
            { id: 17, topic: "BANDING PERPULUHAN", type: "mcq", question: "Manakah yang lebih besar antara 0.35 dan 0.53?", options: ["0.53", "0.35", "Kedua-duanya sama", "Tiada jawapan"], answer: "0.53", hint: "Bandingkan digit di tempat persepuluh dahulu (3 vs 5).", explanation: "5 di tempat persepuluh lebih besar daripada 3, jadi 0.53 > 0.35." },
            { id: 18, topic: "BANDING PERPULUHAN", type: "tf", question: "0.7 adalah lebih kecil daripada 0.68.", options: ["Betul", "Salah"], answer: "Salah", hint: "0.7 sama dengan 0.70.", explanation: "0.70 lebih besar daripada 0.68." },
            { id: 19, topic: "TAMBAH PERPULUHAN", type: "mcq", question: "0.24 + 0.35 = ?", options: ["0.59", "0.69", "0.49", "0.58"], answer: "0.59", hint: "Luruskan titik perpuluhan semasa menambah.", explanation: "0.24 + 0.35 = 0.59." },
            { id: 20, topic: "TAMBAH PERPULUHAN", type: "short", question: "1.4 + 2.3 = ?", options: ["3.7", "3.6", "3.8", "2.7"], answer: "3.7", hint: "Tambah sa dan persepuluh.", explanation: "1.4 + 2.3 = 3.7." },
            { id: 21, topic: "TOLAK PERPULUHAN", type: "mcq", question: "0.85 - 0.42 = ?", options: ["0.43", "0.41", "0.33", "0.53"], answer: "0.43", hint: "Tolak mengikut tempat perpuluhan.", explanation: "0.85 - 0.42 = 0.43." },
            { id: 22, topic: "TOLAK PERPULUHAN", type: "scenario", question: "Ibu ada 0.9 m reben. Dia menggunakannya 0.4 m untuk menghias hadiah. Berapa m reben yang tinggal?", options: ["0.5 m", "0.4 m", "0.6 m", "0.3 m"], answer: "0.5 m", hint: "0.9 - 0.4.", explanation: "0.9 - 0.4 = 0.5 m." },
            { id: 23, topic: "KENAL PERATUS", type: "mcq", question: "Apakah simbol bagi peratus?", options: ["%", "$", "#", "@"], answer: "%", hint: "Simbol ini ada garis senget dan dua bulatan.", explanation: "Simbol peratus ialah %." },
            { id: 24, topic: "KENAL PERATUS", type: "short", question: "Tukarkan 25/100 kepada peratus.", options: ["25%", "2.5%", "250%", "0.25%"], answer: "25%", hint: "Pecahan perseratus secara terus menjadi peratus.", explanation: "25/100 = 25%." },
            { id: 25, topic: "TAMBAH WANG DAN TOLAK WANG", type: "mcq", question: "RM 150 + RM 85 = ?", options: ["RM 235", "RM 225", "RM 245", "RM 215"], answer: "RM 235", hint: "Tambah nilai ringgit.", explanation: "150 + 85 = 235." },
            { id: 26, topic: "TAMBAH WANG DAN TOLAK WANG", type: "scenario", question: "Siti ada RM 50. Dia membeli sebuah buku bernilai RM 18. Berapakah baki wang Siti?", options: ["RM 32", "RM 38", "RM 22", "RM 42"], answer: "RM 32", hint: "RM 50 - RM 18.", explanation: "RM 50 - RM 18 = RM 32." },
            { id: 27, topic: "NILAI TEMPAT", type: "tf", question: "Dalam nombor 9 104, digit 0 berada pada nilai tempat puluh.", options: ["Betul", "Salah"], answer: "Betul", hint: "Kedudukan kedua dari kanan.", explanation: "4 ialah sa, 0 ialah puluh." },
            { id: 28, topic: "BUNDAR NOMBOR", type: "mcq", question: "Nombor manakah yang menjadi 6 000 apabila dibundarkan kepada ribu terdekat?", options: ["5 820", "5 200", "6 700", "5 499"], answer: "5 820", hint: "Ratus mesti 5 atau lebih untuk naik ke 6 000.", explanation: "5 820 mempunyai digit ratus 8 (>=5), dibundarkan menjadi 6 000." },
            { id: 29, topic: "OPERASI TAMBAH", type: "short", question: "3 500 + 4 500 = ?", options: ["8 000", "7 000", "8 500", "9 000"], answer: "8 000", hint: "35 ratus + 45 ratus = 80 ratus.", explanation: "3 500 + 4 500 = 8 000." },
            { id: 30, topic: "OPERASI TOLAK", type: "scenario", question: "Sebuah ladang memetik 4 500 biji kelapa. 1 200 biji telah dijual. Berapa biji kelapa belum dijual?", options: ["3 300", "3 200", "3 400", "2 300"], answer: "3 300", hint: "4 500 - 1 200.", explanation: "4 500 - 1 200 = 3 300 biji." },
            { id: 31, topic: "OPERASI DARAB", type: "tf", question: "Sebarang nombor didarab dengan 0 akan menjadi 0.", options: ["Betul", "Salah"], answer: "Betul", hint: "Hukum darab dengan sifar.", explanation: "Mana-mana nombor × 0 = 0." },
            { id: 32, topic: "OPERASI BAHAGI", type: "short", question: "81 ÷ 9 = ?", options: ["9", "8", "7", "6"], answer: "9", hint: "9 × 9 = 81.", explanation: "81 ÷ 9 = 9." },
            { id: 33, topic: "TAMBAH PECAHAN", type: "mcq", question: "3/10 + 4/10 = ?", options: ["7/10", "7/20", "1/10", "8/10"], answer: "7/10", hint: "3 + 4 = 7.", explanation: "3/10 + 4/10 = 7/10." },
            { id: 34, topic: "KENAL PECAHAN PERSERATUS DAN PERPULUHAN", type: "tf", question: "7/100 ditulis sebagai 0.7 dalam perpuluhan.", options: ["Betul", "Salah"], answer: "Salah", hint: "7/100 ada dua tempat perpuluhan (0.07).", explanation: "7/100 = 0.07. Manakala 0.7 = 7/10." },
            { id: 35, topic: "BANDING PERPULUHAN", type: "short", question: "Susun mengikut urutan menaik: 0.12, 0.81, 0.05", options: ["0.05, 0.12, 0.81", "0.81, 0.12, 0.05", "0.12, 0.05, 0.81", "0.05, 0.81, 0.12"], answer: "0.05, 0.12, 0.81", hint: "Cari yang paling kecil dahulu.", explanation: "0.05 < 0.12 < 0.81." },
            { id: 36, topic: "TAMBAH PERPULUHAN", type: "scenario", question: "Ali lari 1.2 km pagi dan 2.5 km petang. Berapa jumlah jarak lariannya?", options: ["3.7 km", "3.5 km", "2.7 km", "3.8 km"], answer: "3.7 km", hint: "1.2 + 2.5.", explanation: "1.2 + 2.5 = 3.7 km." },
            { id: 37, topic: "TOLAK PERPULUHAN", type: "short", question: "5.8 - 2.3 = ?", options: ["3.5", "3.3", "2.5", "3.2"], answer: "3.5", hint: "5 - 2 = 3, 0.8 - 0.3 = 0.5.", explanation: "5.8 - 2.3 = 3.5." },
            { id: 38, topic: "KENAL PERATUS", type: "mcq", question: "70 peratus ditulis dalam perkataan sebagai:", options: ["70%", "Tujuh puluh peratus", "Tujuh peratus", "Tujuh ratus peratus"], answer: "Tujuh puluh peratus", hint: "Sebutan bagi 70%.", explanation: "70% disebut sebagai Tujuh puluh peratus." },
            { id: 39, topic: "TAMBAH WANG DAN TOLAK WANG", type: "tf", question: "RM 100 - RM 45.50 = RM 54.50.", options: ["Betul", "Salah"], answer: "Betul", hint: "100.00 - 45.50 = 54.50.", explanation: "RM 100.00 - RM 45.50 = RM 54.50." },
            { id: 40, topic: "TAMBAH WANG DAN TOLAK WANG", type: "scenario", question: "Muthu ada RM 200. Dia membeli kasut RM 80 dan baju RM 50. Berapa baki wang Muthu?", options: ["RM 70", "RM 80", "RM 60", "RM 50"], answer: "RM 70", hint: "RM 200 - RM 80 - RM 50.", explanation: "RM 200 - RM 130 = RM 70." }
        ];

        // Format Date Utility
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr);
                return d.toLocaleDateString('ms-MY', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return String(dateStr);
            }
        };

        // Format Percentage Utility (Fixes 0.45% -> 45%)
        const formatPercentage = (val) => {
            if (val === undefined || val === null || val === '') return '0%';
            let strVal = String(val).replace('%', '').trim();
            let num = parseFloat(strVal);
            if (isNaN(num)) return '0%';
            if (num > 0 && num <= 1) {
                num = num * 100;
            }
            return Math.round(num) + '%';
        };

        function App() {
            const [mode, setMode] = useState('student');
            const [studentName, setStudentName] = useState('');
            const [studentClass, setStudentClass] = useState(KELAS_LIST[0]);
            const [isQuizStarted, setIsQuizStarted] = useState(false);
            
            // Quiz State
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isCorrect, setIsCorrect] = useState(null);
            const [score, setScore] = useState(0);
            const [quizCompleted, setQuizCompleted] = useState(false);
            const [userAnswersHistory, setUserAnswersHistory] = useState([]);

            // Teacher Mode State
            const [passwordInput, setPasswordInput] = useState('');
            const [isTeacherAuthenticated, setIsTeacherAuthenticated] = useState(false);
            const [records, setRecords] = useState([]);
            const [filterClass, setFilterClass] = useState('Semua');
            const [fetchStatus, setFetchStatus] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            // Fetch records from Google Script
            const fetchFromSheet = () => {
                setIsLoading(true);
                setFetchStatus('Sedang menarik rekod dari Google Sheet...');
                fetch(GOOGLE_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        setIsLoading(false);
                        if (Array.isArray(data)) {
                            setRecords(data);
                            setFetchStatus(`✅ Berjaya memuatkan ${data.length} rekod dari Google Sheet!`);
                        } else if (data && data.status === "error") {
                            setFetchStatus(`⚠️ Ralat Google Script: ${data.message}`);
                        } else {
                            setFetchStatus("⚠️ Format data tidak sah.");
                        }
                    })
                    .catch(err => {
                        setIsLoading(false);
                        setFetchStatus(`⚠️ Gagal berhubung: ${err.message}. Sila pastikan New Deployment telah dibuat di Apps Script.`);
                    });
            };

            useEffect(() => {
                if (mode === 'teacher' && isTeacherAuthenticated) {
                    fetchFromSheet();
                }
            }, [mode, isTeacherAuthenticated]);

            // Shuffle answers
            const startQuiz = () => {
                if (!studentName.trim()) {
                    alert('Sila masukkan Nama Murid terlebih dahulu.');
                    return;
                }
                const prepared = SOALAN_DATABASE.map(q => {
                    const opts = [...q.options];
                    for (let i = opts.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [opts[i], opts[j]] = [opts[j], opts[i]];
                    }
                    return { ...q, shuffledOptions: opts };
                });
                setShuffledQuestions(prepared);
                setCurrentQIndex(0);
                setScore(0);
                setUserAnswersHistory([]);
                setIsQuizStarted(true);
                setQuizCompleted(false);
            };

            const handleAnswerSubmit = () => {
                if (!selectedAnswer) return;
                const q = shuffledQuestions[currentQIndex];
                const correct = selectedAnswer === q.answer;
                setIsCorrect(correct);
                setIsSubmitted(true);
                if (correct) setScore(prev => prev + 1);

                setUserAnswersHistory(prev => [...prev, {
                    topic: q.topic,
                    question: q.question,
                    isCorrect: correct
                }]);
            };

            const handleNextQuestion = () => {
                setSelectedAnswer('');
                setIsSubmitted(false);
                setIsCorrect(null);
                if (currentQIndex + 1 < shuffledQuestions.length) {
                    setCurrentQIndex(prev => prev + 1);
                } else {
                    finishQuiz();
                }
            };

            const finishQuiz = () => {
                setQuizCompleted(true);
                const finalScore = score + (isCorrect ? 1 : 0);
                const pct = Math.round((finalScore / SOALAN_DATABASE.length) * 100);

                const studentData = {
                    name: studentName,
                    class: studentClass,
                    score: finalScore,
                    total: SOALAN_DATABASE.length,
                    percentage: pct
                };

                // Hantar ke Google Sheet
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(studentData)
                }).catch(err => console.error("Error hantar:", err));
            };

            const downloadCSV = () => {
                const dataToExport = filteredRecords;
                if (dataToExport.length === 0) {
                    alert("Tiada rekod untuk dimuat turun.");
                    return;
                }
                let csv = "Tarikh,Nama Murid,Kelas,Markah,Jumlah,Peratus (%)\n";
                dataToExport.forEach(r => {
                    csv += `"${formatDate(r.date)}","${r.name}","${r.class}",${r.score},${r.total || 40},"${formatPercentage(r.percentage)}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Rekod_Kuiz_Matematik_T3_${filterClass.replace(' ', '_')}_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
            };

            // Filter records by selected class
            const filteredRecords = records.filter(r => {
                if (filterClass === 'Semua') return true;
                return r.class === filterClass;
            });

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6">
                    {/* Header Nav */}
                    <div className="bg-blue-600 text-white rounded-2xl p-4 md:p-6 mb-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-yellow-400 text-blue-900 p-3 rounded-xl font-bold text-2xl">
                                <i className="fa-solid fa-calculator"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-wide">Kuiz Matematik Tahun 3</h1>
                                <p className="text-blue-100 text-sm">Interaktif • Ceria • Pintar</p>
                            </div>
                        </div>
                        <div className="flex bg-blue-800 p-1 rounded-xl">
                            <button 
                                onClick={() => setMode('student')}
                                className={`px-4 py-2 rounded-lg text-sm font-bold transition ${mode === 'student' ? 'bg-white text-blue-900 shadow' : 'text-blue-200'}`}>
                                <i className="fa-solid fa-user-graduate mr-2"></i>Mod Murid
                            </button>
                            <button 
                                onClick={() => setMode('teacher')}
                                className={`px-4 py-2 rounded-lg text-sm font-bold transition ${mode === 'teacher' ? 'bg-yellow-400 text-blue-900 shadow' : 'text-blue-200'}`}>
                                <i className="fa-solid fa-user-tie mr-2"></i>Mod Guru
                            </button>
                        </div>
                    </div>

                    {/* MOD MURID */}
                    {mode === 'student' && (
                        <div>
                            {!isQuizStarted ? (
                                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 max-w-lg mx-auto">
                                    <h2 className="text-2xl font-bold text-slate-800 mb-6 text-center">Pendaftaran Murid</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">Nama Murid:</label>
                                            <input 
                                                type="text" 
                                                value={studentName}
                                                onChange={(e) => setStudentName(e.target.value)}
                                                placeholder="Taip nama penuh anda..."
                                                className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">Kelas:</label>
                                            <select 
                                                value={studentClass}
                                                onChange={(e) => setStudentClass(e.target.value)}
                                                className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium bg-white">
                                                {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                                            </select>
                                        </div>
                                        <button 
                                            onClick={startQuiz}
                                            className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-md transition text-lg mt-4">
                                            Mula Kuiz (40 Soalan) <i className="fa-solid fa-play ml-2"></i>
                                        </button>
                                    </div>
                                </div>
                            ) : !quizCompleted ? (
                                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200">
                                    {/* Progress Bar & Header */}
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-xs font-bold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                                            {shuffledQuestions[currentQIndex].topic}
                                        </span>
                                        <span className="text-sm font-bold text-slate-500">
                                            Soalan {currentQIndex + 1} / {SOALAN_DATABASE.length}
                                        </span>
                                    </div>

                                    <div className="w-full bg-slate-200 h-3 rounded-full mb-6 overflow-hidden">
                                        <div 
                                            className="bg-blue-600 h-full transition-all duration-300"
                                            style={{ width: `${((currentQIndex + 1) / SOALAN_DATABASE.length) * 100}%` }}></div>
                                    </div>

                                    <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-6">
                                        {shuffledQuestions[currentQIndex].question}
                                    </h3>

                                    {/* Options */}
                                    <div className="space-y-3 mb-6">
                                        {shuffledQuestions[currentQIndex].shuffledOptions.map((opt, idx) => {
                                            let btnStyle = "border-slate-200 hover:bg-slate-50 text-slate-700";
                                            if (selectedAnswer === opt) {
                                                btnStyle = "border-blue-500 bg-blue-50 text-blue-900 font-bold ring-2 ring-blue-400";
                                            }
                                            if (isSubmitted) {
                                                if (opt === shuffledQuestions[currentQIndex].answer) {
                                                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold";
                                                } else if (selectedAnswer === opt) {
                                                    btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-bold";
                                                }
                                            }
                                            return (
                                                <button 
                                                    key={idx}
                                                    disabled={isSubmitted}
                                                    onClick={() => setSelectedAnswer(opt)}
                                                    className={`w-full text-left p-4 rounded-xl border-2 transition flex items-center justify-between ${btnStyle}`}>
                                                    <span>{opt}</span>
                                                    {isSubmitted && opt === shuffledQuestions[currentQIndex].answer && (
                                                        <i className="fa-solid fa-circle-check text-emerald-600 text-xl"></i>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* Feedback Box */}
                                    {isSubmitted && (
                                        <div className={`p-4 rounded-xl mb-6 ${isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'}`}>
                                            <p className="font-bold text-lg mb-1">
                                                {isCorrect ? "🎉 Tahniah! Jawapan Betul!" : "❌ Alamak, Jawapan Kurang Tepat."}
                                            </p>
                                            <p className="text-sm">{shuffledQuestions[currentQIndex].explanation}</p>
                                        </div>
                                    )}

                                    {/* Hint Box jika salah */}
                                    {!isCorrect && selectedAnswer && !isSubmitted && (
                                        <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl mb-4 text-xs text-amber-800">
                                            💡 <strong>Petunjuk:</strong> {shuffledQuestions[currentQIndex].hint}
                                        </div>
                                    )}

                                    {/* Buttons */}
                                    <div className="flex justify-end gap-3">
                                        {!isSubmitted ? (
                                            <button 
                                                onClick={handleAnswerSubmit}
                                                disabled={!selectedAnswer}
                                                className={`px-6 py-3 rounded-xl font-bold text-white transition ${selectedAnswer ? 'bg-blue-600 hover:bg-blue-700 shadow-md' : 'bg-slate-300 cursor-not-allowed'}`}>
                                                Hantar Jawapan
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={handleNextQuestion}
                                                className="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-md transition">
                                                {currentQIndex + 1 === SOALAN_DATABASE.length ? "Lihat Keputusan" : "Soalan Seterusnya ➔"}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                /* Keputusan Akhir Murid */
                                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 text-center">
                                    <div className="inline-block p-4 bg-yellow-100 text-yellow-600 rounded-full text-4xl mb-4">🏆</div>
                                    <h2 className="text-2xl font-black text-slate-800 mb-1">Syabas, {studentName}!</h2>
                                    <p className="text-slate-500 text-sm mb-6">Kelas: {studentClass}</p>

                                    <div className="bg-blue-50 rounded-2xl p-6 mb-6 inline-block w-full max-w-xs">
                                        <span className="block text-slate-500 text-xs uppercase tracking-wider font-bold mb-1">Markah Akhir</span>
                                        <span className="text-5xl font-black text-blue-600">{score} / {SOALAN_DATABASE.length}</span>
                                        <span className="block text-sm font-bold text-blue-800 mt-2">({Math.round((score / SOALAN_DATABASE.length)*100)}%)</span>
                                    </div>

                                    <p className="text-sm text-emerald-600 font-bold mb-6">
                                        ✅ Keputusan anda telah secara automatik disimpan ke rekod guru!
                                    </p>

                                    <button 
                                        onClick={() => setIsQuizStarted(false)}
                                        className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow transition">
                                        Cuba Sekali Lagi
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* MOD GURU */}
                    {mode === 'teacher' && (
                        <div>
                            {!isTeacherAuthenticated ? (
                                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 max-w-md mx-auto text-center">
                                    <div className="bg-yellow-100 text-yellow-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                                        🔒
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-800 mb-2">Akses Mod Guru</h2>
                                    <p className="text-xs text-slate-500 mb-4">Masukkan kata laluan untuk mengakses laporan murid.</p>
                                    <input 
                                        type="password" 
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        placeholder="••••"
                                        className="w-full text-center px-4 py-3 border border-slate-300 rounded-xl mb-4 font-bold tracking-widest text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                    <button 
                                        onClick={() => {
                                            if (passwordInput === '5555') {
                                                setIsTeacherAuthenticated(true);
                                            } else {
                                                alert('Kata laluan salah!');
                                            }
                                        }}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">
                                        Log Masuk
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-800">Papan Pemuka Rekod Keputusan Murid</h2>
                                            <p className="text-xs text-slate-500">
                                                Paparan: {filteredRecords.length} daripada {records.length} rekod
                                            </p>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            <button 
                                                onClick={fetchFromSheet}
                                                disabled={isLoading}
                                                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-2">
                                                <i className={`fa-solid fa-rotate ${isLoading ? 'fa-spin' : ''}`}></i> Muat Semula Data
                                            </button>
                                            <button 
                                                onClick={downloadCSV}
                                                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-2">
                                                <i className="fa-solid fa-file-excel"></i> Download Excel (CSV)
                                            </button>
                                            <button 
                                                onClick={() => window.print()}
                                                className="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-xs font-bold shadow flex items-center gap-2">
                                                <i className="fa-solid fa-print"></i> Print Report
                                            </button>
                                        </div>
                                    </div>

                                    {/* Status Message & Filter Bar */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div className="md:col-span-2 p-3 bg-slate-100 rounded-xl text-xs font-semibold text-slate-700 flex items-center">
                                            <span>Status: {fetchStatus || 'Sedia'}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <label className="text-xs font-bold text-slate-700 whitespace-nowrap">Tapis Kelas:</label>
                                            <select 
                                                value={filterClass}
                                                onChange={(e) => setFilterClass(e.target.value)}
                                                className="w-full p-2 text-xs border border-slate-300 rounded-xl font-bold bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                                <option value="Semua">🔍 Semua Kelas ({records.length})</option>
                                                {KELAS_LIST.map(k => (
                                                    <option key={k} value={k}>
                                                        {k} ({records.filter(r => r.class === k).length})
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Table */}
                                    <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-700 uppercase text-xs font-bold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-3">Tarikh</th>
                                                    <th className="p-3">Nama Murid</th>
                                                    <th className="p-3">Kelas</th>
                                                    <th className="p-3">Markah</th>
                                                    <th className="p-3">Peratus</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200">
                                                {filteredRecords.length > 0 ? (
                                                    filteredRecords.map((r, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 transition">
                                                            <td className="p-3 text-xs text-slate-500 font-medium">
                                                                {formatDate(r.date)}
                                                            </td>
                                                            <td className="p-3 font-bold text-slate-800">{r.name}</td>
                                                            <td className="p-3">
                                                                <span className="px-2 py-1 bg-slate-100 rounded-md text-xs font-semibold text-slate-700">
                                                                    {r.class}
                                                                </span>
                                                            </td>
                                                            <td className="p-3 font-bold text-slate-800">{r.score} / {r.total || 40}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-1 rounded-full text-xs font-bold ${
                                                                    parseInt(formatPercentage(r.percentage)) >= 80 
                                                                        ? 'bg-emerald-100 text-emerald-800' 
                                                                        : parseInt(formatPercentage(r.percentage)) >= 50
                                                                        ? 'bg-amber-100 text-amber-800'
                                                                        : 'bg-rose-100 text-rose-800'
                                                                }`}>
                                                                    {formatPercentage(r.percentage)}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="5" className="p-8 text-center text-slate-400">
                                                            {records.length > 0 
                                                                ? `Tiada rekod murid untuk kelas "${filterClass}".` 
                                                                : 'Tekan "Muat Semula Data" di atas untuk mengambil rekod dari Google Sheet.'}
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
